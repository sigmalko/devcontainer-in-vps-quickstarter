services:
  ide-service:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    user: root
    init: true
    ports:
      - "${SSH_PORT:-2222}:22"
    volumes:
      # Windows bind mounts expose files as mode 0777. Mount the host key only
      # as a source and copy it to the container filesystem before sshd starts.
      - ../.ssh/ssh_host_ed25519_key:/run/host-ssh/ssh_host_ed25519_key:ro
      - ../.ssh/ssh_host_ed25519_key.pub:/run/host-ssh/ssh_host_ed25519_key.pub:ro
    # DO NOT MOUNT /var/run/docker.sock:/var/run/docker.sock HERE (#5458).
    # The `docker-outside-of-docker` feature in devcontainer.json adds the host
    # socket: it mounts it as /var/run/docker-host.sock and places ITS OWN
    # socat proxy (mode=660,user=vscode) at /var/run/docker.sock in
    # /usr/local/share/docker-init.sh. This init runs
    # `rm -rf /var/run/docker.sock` with `set -e`, so a second bind mount at
    # the same path causes EBUSY: the script dies BEFORE starting socat, and
    # the container is left with a root:root 660 socket that `vscode` has no
    # way to access (symptom: `permission denied ...
    # unix:///var/run/docker.sock`). Without this entry, the container does
    # NOT lose access to the host socket — the feature adds it.
    environment:
      TZ: Europe/Warsaw
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.48}
      CHROME_BIN: /usr/bin/chromium-browser
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    # Dev Containers execute this command as containerUser (vscode), so the
    # privileged setup and daemons use sudo. Copying the bind-mounted key gives
    # it Linux mode 0600, which sshd requires even when the host is Windows.
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        sudo install -d -o root -g root -m 700 /run/ssh-host-key
        sudo install -o root -g root -m 600 /run/host-ssh/ssh_host_ed25519_key /run/ssh-host-key/ssh_host_ed25519_key
        sudo install -o root -g root -m 644 /run/host-ssh/ssh_host_ed25519_key.pub /run/ssh-host-key/ssh_host_ed25519_key.pub
        sudo cron
        exec sudo /usr/sbin/sshd -D -e
